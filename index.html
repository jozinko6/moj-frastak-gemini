<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Môj Fraštak</title>
    
    <!-- Modern PWA Settings & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7A263A" />
    
    <!-- iOS / Safari App Shell Enhancements -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Môj Fraštak" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              writable: true,
              value: originalFetch
            });
          }
        } catch (e) {
          console.warn('Failed to make window.fetch writable:', e);
        }
      })();
    </script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('PWA ServiceWorker registered successfully with scope: ', registration.scope);
            })
            .catch(function(err) {
              console.log('PWA ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
